name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - run: gradle build
            - run: |
          ls -la build/libs
          for f in build/libs/*.jar; do unzip -l "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: basefinder-jar
          path: build/libs/*.jar
